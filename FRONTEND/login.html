<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BelajarYuk - Masuk atau Daftar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lexend', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated Background Swipe */
        @keyframes gradientSwipe {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #2b7cee20, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientSwipe 12s ease infinite;
        }
        
        /* Particle Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background: rgba(43, 124, 238, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Glassmorphism Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .glass-card:hover {
            transform: translateY(-8px);
            border-color: rgba(43, 124, 238, 0.5);
            box-shadow: 0 30px 60px -12px rgba(43, 124, 238, 0.3);
        }
        
        /* Floating Animation */
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        
        /* Slide In Animation */
        .slide-in {
            animation: slideIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Input Focus Glow */
        .input-glow {
            transition: all 0.3s ease;
        }
        
        .input-glow:focus {
            outline: none;
            border-color: #2b7cee;
            box-shadow: 0 0 0 3px rgba(43, 124, 238, 0.3), 0 0 0 6px rgba(43, 124, 238, 0.1);
            transform: scale(1.02);
        }
        
        /* Button Shine Effect */
        .btn-shine {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-shine::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-shine:hover::before {
            left: 100%;
        }
        
        .btn-shine:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(43, 124, 238, 0.5);
        }
        
        /* Button Pulse */
        .btn-pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(43, 124, 238, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(43, 124, 238, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(43, 124, 238, 0);
            }
        }
        
        /* Tab Animation */
        .tab-active {
            background: linear-gradient(135deg, #2b7cee, #1a5bbf);
            color: white;
            box-shadow: 0 4px 15px -3px rgba(43, 124, 238, 0.4);
        }
        
        .tab-inactive {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab-inactive:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        /* Transition untuk form switching */
        .form-transition {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        /* Logo Icon Animation */
        .logo-icon {
            animation: rotateIcon 20s linear infinite;
        }
        
        @keyframes rotateIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Typing cursor effect untuk judul */
        .typing-text {
            overflow: hidden;
            border-right: 2px solid #2b7cee;
            white-space: nowrap;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #2b7cee; }
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .glass-card {
                margin: 0 16px;
            }
            .typing-text {
                white-space: normal;
                border-right: none;
                animation: none;
            }
        }
    </style>
</head>
<body class="animated-bg flex items-center justify-center min-h-screen p-4 relative">
    
    <!-- Particle Background -->
    <div class="particles" id="particles"></div>
    
    <div class="w-full max-w-md relative z-10 slide-in">
        <div class="glass-card p-6 md:p-8 float-animation">
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3 bg-white/10 backdrop-blur-sm px-5 py-3 rounded-full mb-4">
                    <span class="material-symbols-outlined text-primary text-3xl logo-icon">auto_stories</span>
                    <span class="text-primary font-bold text-xl">BelajarYuk</span>
                </div>
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-2 typing-text" style="display: inline-block;">
                    Selamat Datang!
                </h2>
                <p class="text-slate-300 text-sm">Masuk atau daftar untuk melanjutkan belajar</p>
            </div>
            
            <!-- Tab Login/Register -->
            <div class="flex gap-3 mb-8">
                <button id="tabLogin" onclick="showLogin()" class="flex-1 py-3 text-center font-semibold rounded-xl transition-all duration-300 tab-active">
                    Masuk
                </button>
                <button id="tabRegister" onclick="showRegister()" class="flex-1 py-3 text-center font-semibold rounded-xl transition-all duration-300 tab-inactive">
                    Daftar
                </button>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm" class="space-y-5 form-transition">
                <div>
                    <label class="text-sm font-medium text-slate-300 mb-1 block">Email</label>
                    <input id="loginEmail" type="email" class="input-glow w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-primary transition-all" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-300 mb-1 block">Password</label>
                    <input id="loginPassword" type="password" class="input-glow w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-primary transition-all" placeholder="********">
                </div>
                <button onclick="loginUser()" class="btn-shine btn-pulse w-full bg-gradient-to-r from-primary to-primary/80 hover:from-primary/90 hover:to-primary text-white font-bold py-3 rounded-xl transition-all transform">
                    <span class="flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-base">login</span>
                        Masuk
                    </span>
                </button>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="space-y-5 hidden form-transition">
                <div>
                    <label class="text-sm font-medium text-slate-300 mb-1 block">Nama Lengkap</label>
                    <input id="regName" class="input-glow w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-primary transition-all" placeholder="Nama Anda">
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-300 mb-1 block">Email</label>
                    <input id="regEmail" type="email" class="input-glow w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-primary transition-all" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-300 mb-1 block">Password</label>
                    <input id="regPassword" type="password" class="input-glow w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-primary transition-all" placeholder="Minimal 8 karakter">
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-300 mb-1 block">Konfirmasi Password</label>
                    <input id="regConfirm" type="password" class="input-glow w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:border-primary transition-all" placeholder="Ulangi password">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="terms" class="w-4 h-4 accent-primary">
                    <label class="text-sm text-slate-300">Saya setuju 
                        <a onclick="alert('Syarat & Ketentuan BelajarYuk: Belajar dengan giat, raih prestasi!')" class="text-primary cursor-pointer hover:underline">Syarat & Ketentuan</a>
                    </label>
                </div>
                <button onclick="registerUser()" class="btn-shine w-full bg-gradient-to-r from-secondary to-secondary/80 hover:from-secondary/90 hover:to-secondary text-white font-bold py-3 rounded-xl transition-all transform">
                    <span class="flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-base">person_add</span>
                        Daftar
                    </span>
                </button>
            </div>
            
            <!-- Footer -->
            <div class="text-center text-slate-500 text-xs mt-8 pt-4 border-t border-white/10">
                BelajarYuk - Dive In, Genius Out! 🚀
            </div>
        </div>
    </div>
    
    <script>
        const API = "https://belajaryuk-production.up.railway.app/api";
        
        // ====================== PARTICLE BACKGROUND ======================
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 6 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(particle);
            }
        }
        
        createParticles();
        
        // ====================== TAB ANIMATION ======================
        function showLogin() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            
            loginForm.style.opacity = '0';
            loginForm.style.transform = 'translateX(-20px)';
            registerForm.style.opacity = '0';
            registerForm.style.transform = 'translateX(20px)';
            
            setTimeout(() => {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginForm.style.opacity = '1';
                loginForm.style.transform = 'translateX(0)';
            }, 50);
            
            tabLogin.classList.remove('tab-inactive');
            tabLogin.classList.add('tab-active');
            tabRegister.classList.remove('tab-active');
            tabRegister.classList.add('tab-inactive');
        }
        
        function showRegister() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            
            loginForm.style.opacity = '0';
            loginForm.style.transform = 'translateX(-20px)';
            registerForm.style.opacity = '0';
            registerForm.style.transform = 'translateX(20px)';
            
            setTimeout(() => {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerForm.style.opacity = '1';
                registerForm.style.transform = 'translateX(0)';
            }, 50);
            
            tabRegister.classList.remove('tab-inactive');
            tabRegister.classList.add('tab-active');
            tabLogin.classList.remove('tab-active');
            tabLogin.classList.add('tab-inactive');
        }
        
        // ====================== LOGIN FUNCTION ======================
        async function loginUser() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showToast('⚠️ Email dan password harus diisi', 'warning');
                return;
            }
            
            // Disable button
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">⏳ Memproses...</span>';
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    if (!data.token) {
                        showToast('❌ Token tidak ditemukan', 'error');
                        return;
                    }
                    
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('userRole', data.user.role);
                    
                    showToast('✅ Login berhasil! Mengarahkan...', 'success');
                    
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                } else {
                    showToast(data.message || 'Login gagal. Periksa email/password.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('❌ Error: Server tidak merespons', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // ====================== REGISTER FUNCTION ======================
        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const terms = document.getElementById('terms').checked;
            
            if (!name || !email || !password || !confirm) {
                showToast('⚠️ Semua field harus diisi', 'warning');
                return;
            }
            if (password.length < 8) {
                showToast('⚠️ Password minimal 8 karakter', 'warning');
                return;
            }
            if (password !== confirm) {
                showToast('⚠️ Password tidak cocok', 'warning');
                return;
            }
            if (!terms) {
                showToast('⚠️ Setujui syarat & ketentuan', 'warning');
                return;
            }
            
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">⏳ Memproses...</span>';
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, konfirmasiPassword: confirm, name })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('userRole', data.user.role);
                    
                    showToast('🎉 Registrasi berhasil! Mengarahkan...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showToast(data.message || 'Registrasi gagal', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('❌ Error: Server tidak merespons', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // ====================== TOAST NOTIFICATION ======================
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl text-white text-sm font-medium shadow-lg transition-all transform translate-x-0`;
            
            let bgColor = '';
            let icon = '';
            
            if (type === 'success') {
                bgColor = 'bg-gradient-to-r from-green-500 to-green-600';
                icon = '✅';
            } else if (type === 'error') {
                bgColor = 'bg-gradient-to-r from-red-500 to-red-600';
                icon = '❌';
            } else {
                bgColor = 'bg-gradient-to-r from-yellow-500 to-yellow-600';
                icon = '⚠️';
            }
            
            toast.className = `${toast.className} ${bgColor}`;
            toast.innerHTML = `${icon} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // Cek parameter URL untuk tab register
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'register') {
            showRegister();
        }
    </script>
</body>
</html>
